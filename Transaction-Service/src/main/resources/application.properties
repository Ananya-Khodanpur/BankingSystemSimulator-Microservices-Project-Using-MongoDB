spring.application.name=Transaction-Service
server.port=8082

# for local use
#spring.data.mongodb.database=transactions_db
#spring.data.mongodb.uri=mongodb://localhost:27017/transactions_db
#spring.data.mongodb.host=localhost
#spring.data.mongodb.port=27017



# for circuit breaker
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=5
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=5s

resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=5
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=3s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/